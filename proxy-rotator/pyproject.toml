[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-rotator"
version = "1.0.0"
description = "Rotating proxy gateway with health-checked IP pools, tier failover, geo targeting and per-upstream slot control"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rotator = "rotator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]