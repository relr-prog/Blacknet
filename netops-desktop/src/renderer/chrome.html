<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The chrome is local only: no remote anything, no inline script. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>BlackNet</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <div id="tabrow">
      <img id="brand" src="../../assets/icons/blacknet-32.png" alt="" width="20" height="20" />
      <div id="tabstrip" role="tablist" aria-label="Open tabs"></div>
    </div>

    <form id="toolbar" autocomplete="off">
      <button type="button" id="back" title="Back" aria-label="Back">&#8592;</button>
      <button type="button" id="forward" title="Forward" aria-label="Forward">&#8594;</button>
      <button type="button" id="reload" title="Reload" aria-label="Reload">&#8635;</button>
      <button type="button" id="newtab" title="New tab" aria-label="New tab">+</button>

      <div class="field">
        <span id="lock" title="Connection policy" aria-hidden="true">&#128274;</span>
        <span id="audio" hidden title="Audio output">&#128266;</span>
        <input
          id="url"
          name="url"
          type="text"
          spellcheck="false"
          aria-label="Address and search bar"
          placeholder="Search or type an address"
        />
        <span id="status" aria-live="polite"></span>
      </div>

      <button type="button" id="inspect" title="Privacy report">Privacy</button>
      <button type="button" id="settings-btn" title="Settings" aria-label="Settings">Settings</button>
    </form>

    <!-- Settings and Privacy used to be dialogs here. They now open as a page of
         the shell in an ordinary tab (renderer/pages/settings.html), so nothing
         floats over the browser any more. -->

    <!-- The save-password prompt. Exactly two answers, as asked for: save it or
         do it later. It never shows the password itself. -->
    <div id="offer" hidden role="dialog" aria-modal="false" aria-labelledby="offer-question">
      <p id="offer-question">Do you wanna to save this password?</p>
      <p id="offer-site" class="mono"></p>
      <div class="actions">
        <button type="button" id="offer-save">Save</button>
        <button type="button" id="offer-skip">Not now</button>
      </div>
    </div>

    <script src="chrome.js"></script>
  </body>
</html>
