<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <!-- The explanation a refused address gets instead of a load. It is a local
         file in a tab that has no bridge, so it can neither fetch anything nor
         ask the shell anything: script-src 'self' is what lets unreachable.js
         fill the text in from the address it was given. Without it this page
         loads and then sits on its placeholders forever. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self' data:; script-src 'self';"
    />
    <title>This site can't be reached</title>
    <link rel="icon" href="../../assets/icons/blacknet-32.png" type="image/png" />
    <link rel="stylesheet" href="chrome.css" />
    <link rel="stylesheet" href="unreachable.css" />
  </head>
  <body class="unreachable">
    <main>
      <img class="logo" src="../../assets/icons/blacknet-64.png" alt="" width="56" height="56" />
      <h1>This site can't be reached</h1>
      <p class="reason" id="reason">&nbsp;</p>
      <p class="code">ERR_NAME_NOT_RESOLVED</p>
      <p class="hint">
        Check the address for a typo, or press Reload to try again. The address
        stays in the address bar either way.
      </p>
      <p><button id="reload" type="button">Reload</button></p>
    </main>
    <script src="unreachable.js"></script>
  </body>
</html>
