<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- The shell's own results page. It runs no code but its own: the results
         are pushed in as data by the main process, and the page has no bridge to
         ask for anything else. script-src 'self' is what lets search.js build
         the list and turn the in-page box into a "#q=" the shell can read. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self' data:; script-src 'self';"
    />
    <title>BlackNet Search</title>
    <link rel="icon" href="../../assets/icons/blacknet-32.png" type="image/png" />
    <link rel="stylesheet" href="chrome.css" />
    <link rel="stylesheet" href="search.css" />
  </head>
  <body class="search">
    <main>
      <header class="searchbar">
        <img class="mark" src="../../assets/icons/blacknet-32.png" alt="" width="24" height="24" />
        <form id="form" role="search" autocomplete="off">
          <span class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <line x1="16.4" y1="16.4" x2="21" y2="21" />
            </svg>
            <input
              id="q"
              type="search"
              name="q"
              placeholder="Search public sources"
              aria-label="Search"
              spellcheck="false"
            />
          </span>
          <button type="submit">Search</button>
        </form>
      </header>

      <p class="meta busy" id="meta">Searching&hellip;</p>

      <!-- Decorative placeholder shown while the shell is querying. It carries
           no information, so it is aria-hidden and swapped out on the first
           answer. -->
      <div class="skeleton" id="skeleton" aria-hidden="true">
        <div class="sk"><span class="sk-title"></span><span class="sk-line"></span><span class="sk-line short"></span></div>
        <div class="sk"><span class="sk-title"></span><span class="sk-line"></span></div>
        <div class="sk"><span class="sk-title"></span><span class="sk-line short"></span></div>
      </div>

      <ol class="results" id="results"></ol>

      <div class="emptystate" id="empty" hidden>
        <img class="art" src="../../assets/icons/blacknet-64.png" alt="" width="48" height="48" />
        <p id="emptyText"></p>
      </div>

      <p class="sources" id="sources"></p>
    </main>
    <script src="search.js"></script>
  </body>
</html>
