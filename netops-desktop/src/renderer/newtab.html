<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- Local page, no network, no script: a strict CSP keeps it that way. The
         search box is a plain form; submitting it is a GET to the shell's own
         results page, which the shell answers with the selected engine. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self' data:;"
    />
    <title>BlackNet</title>
    <link rel="icon" href="../../assets/icons/blacknet-32.png" type="image/png" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="home">
      <img class="logo" src="../../assets/icons/blacknet-128.png" alt="" width="72" height="72" />
      <h1>BlackNet</h1>

      <form id="search" action="search.html" method="get">
        <input
          type="search"
          name="q"
          placeholder="Search privately, or type an address"
          autocomplete="off"
          spellcheck="false"
          autofocus
          aria-label="Search the web"
        />
        <div class="actions">
          <button type="submit">Search</button>
        </div>
      </form>

      <p class="hint">
        Queries stay on this machine by default. Ctrl+L searches from anywhere;
        Ctrl+T opens a tab.
      </p>
    </main>

    <footer>
      <p>
        A C++ policy guards every request: no trackers, no private addresses,
        no leaky headers. Nothing here ever touches the network by itself.
      </p>
    </footer>
  </body>
</html>
